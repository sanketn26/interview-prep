name: Validate PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs (strict mode — fails on warnings)
        run: mkdocs build --strict

      - name: Python example tests
        run: pytest tests/python -q

      - name: JavaScript syntax
        run: |
          node --check docs/assets/js/simulations.js
          node --check docs/assets/js/progress.js

      - name: Every extra_css/extra_javascript target exists under docs/
        run: python scripts/check_assets.py
