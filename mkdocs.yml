site_name: Senior Engineer Academy
site_description: >-
  A production-quality interactive learning environment for senior software engineers
  targeting Staff / Senior / Lead roles — covering System Design, DSA, Distributed
  Systems, and Behavioural interviews.
site_url: https://sanketn26.github.io/interview-prep/
repo_url: https://github.com/sanketn26/interview-prep
repo_name: sanketn26/interview-prep
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/diagrams/logo.svg
  favicon: assets/diagrams/logo.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - assets/css/academy.css

extra_javascript:
  - assets/js/simulations.js
  - assets/js/progress.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sanketn26/interview-prep
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]

