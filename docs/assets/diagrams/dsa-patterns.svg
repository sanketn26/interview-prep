<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img">
<title>A keyword names a candidate. Confirm the structure before you commit.</title>
<rect width="960" height="200" rx="16" fill="#f8fafc"/>
<rect x="20" y="64" width="220" height="96" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="34" y="96" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">1  Constraints</text>
<text x="34" y="124" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="start">drop classes that cannot finish</text>
<rect x="256" y="64" width="220" height="96" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="270" y="96" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">2  Shape</text>
<text x="270" y="124" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="start">array, tree, graph, stream</text>
<rect x="492" y="64" width="220" height="96" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="506" y="96" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">3  Keyword</text>
<text x="506" y="124" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="start">a candidate, not a decision</text>
<rect x="728" y="64" width="220" height="96" rx="12" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<text x="742" y="96" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">4  Confirm</text>
<text x="742" y="124" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="start">contiguous? sorted? overlap?</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">A keyword names a candidate. Confirm the structure before you commit.</text>
</svg>
