<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img">
<title>Every dyadic range has a node. A query uses a few of them, not every leaf.</title>
<rect width="960" height="230" rx="16" fill="#f8fafc"/>
<rect x="380" y="48" width="200" height="32" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="480.0" y="69" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[1..8]</text>
<line x1="480" y1="80" x2="250" y2="104" stroke="#64748b" stroke-width="2"/>
<line x1="480" y1="80" x2="710" y2="104" stroke="#64748b" stroke-width="2"/>
<rect x="150" y="104" width="200" height="32" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="250.0" y="125" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[1..4]</text>
<rect x="610" y="104" width="200" height="32" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="710.0" y="125" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[5..8]</text>
<line x1="250" y1="136" x2="140" y2="160" stroke="#64748b" stroke-width="2"/>
<line x1="250" y1="136" x2="340" y2="160" stroke="#64748b" stroke-width="2"/>
<line x1="710" y1="136" x2="600" y2="160" stroke="#64748b" stroke-width="2"/>
<line x1="710" y1="136" x2="800" y2="160" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="160" width="140" height="32" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="120.0" y="181" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[1..2]</text>
<rect x="250" y="160" width="140" height="32" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="320.0" y="181" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[3..4]</text>
<rect x="520" y="160" width="140" height="32" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="590.0" y="181" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[5..6]</text>
<rect x="740" y="160" width="140" height="32" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="810.0" y="181" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">[7..8]</text>
<text x="50" y="216" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">A query for [5..6] is the one green node. It does not walk the rest of the tree.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Every dyadic range has a node. A query uses a few of them, not every leaf.</text>
</svg>
