<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" role="img">
<title>Kubernetes networking</title>
<rect width="1040" height="760" rx="20" fill="#f8fafc"/>
<text x="36" y="46" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="750">Kubernetes networking</text>
<text x="36" y="72" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14">Every pod has an IP. A Service is a stable name in front of the pods that are Ready.</text>
<rect x="28" y="96" width="312" height="280" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<rect x="28" y="96" width="312" height="8" rx="4" fill="#4f46e5"/>
<text x="46" y="132" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">01  CNI</text>
<text x="46" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">Pod to pod</text>
<text x="46" y="188" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">The CNI gives every pod its own IP</text>
<text x="46" y="210" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">10.244.1.10 can reach 10.244.2.20</text>
<text x="46" y="232" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Same cluster, including other nodes</text>
<text x="46" y="254" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">No Service is required for this</text>
<text x="46" y="354" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">Flat pod network, not per-node NAT</text>
<rect x="356" y="96" width="312" height="280" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<rect x="356" y="96" width="312" height="8" rx="4" fill="#0d9488"/>
<text x="374" y="132" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">02  VIP</text>
<text x="374" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">Pod to Service</text>
<text x="374" y="188" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">ClusterIP does not run your process</text>
<text x="374" y="210" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">A selector names the current pods</text>
<text x="374" y="232" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Only Ready addresses get traffic</text>
<text x="374" y="254" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Empty endpoints: the VIP is a hole</text>
<text x="374" y="354" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">Stable name, changing backends</text>
<rect x="684" y="96" width="312" height="280" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<rect x="684" y="96" width="312" height="8" rx="4" fill="#d97706"/>
<text x="702" y="132" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">03  L7</text>
<text x="702" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">Ingress</text>
<text x="702" y="188" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Internet hits the ingress controller</text>
<text x="702" y="210" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Host and path pick a Service</text>
<text x="702" y="232" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">TLS usually ends at the controller</text>
<text x="702" y="254" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Then the normal Service path</text>
<text x="702" y="354" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">One front door, many Services</text>
<rect x="28" y="392" width="312" height="280" rx="16" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
<rect x="28" y="392" width="312" height="8" rx="4" fill="#e11d48"/>
<text x="46" y="428" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">04  FIREWALL</text>
<text x="46" y="452" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">NetworkPolicy</text>
<text x="46" y="484" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Default: every pod may talk</text>
<text x="46" y="506" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Selecting a pod denies the rest</text>
<text x="46" y="528" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Forgetting DNS (port 53) is an outage</text>
<text x="46" y="550" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Use selectors, not raw IPs</text>
<text x="46" y="650" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">Opt-in. Nothing is denied until you select</text>
<rect x="356" y="392" width="312" height="280" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="356" y="392" width="312" height="8" rx="4" fill="#7c3aed"/>
<text x="374" y="428" fill="#7c3aed" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">05  COREDNS</text>
<text x="374" y="452" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">Cluster DNS</text>
<text x="374" y="484" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">svc.ns.svc.cluster.local</text>
<text x="374" y="506" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">A normal Service: one A record, the VIP</text>
<text x="374" y="528" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">A headless Service: one A per pod</text>
<text x="374" y="550" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Short names expand via ndots search</text>
<text x="374" y="650" fill="#7c3aed" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">Names, not hard-coded pod IPs</text>
<rect x="684" y="392" width="312" height="280" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<rect x="684" y="392" width="312" height="8" rx="4" fill="#0284c7"/>
<text x="702" y="428" fill="#0284c7" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">06  NORTH-SOUTH</text>
<text x="702" y="452" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750">From outside</text>
<text x="702" y="484" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Cloud LB, NodePort, or ExternalIP</text>
<text x="702" y="506" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Lands on a node, then a Service</text>
<text x="702" y="528" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Pod IPs are usually not public</text>
<text x="702" y="550" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">HTTP from users should use Ingress</text>
<text x="702" y="650" fill="#0284c7" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="650">Outside address is not the pod address</text>
<text x="36" y="738" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13">Pod IP  →  Service VIP  →  Ingress  →  policy  →  DNS name  →  cloud entry</text>
</svg>
