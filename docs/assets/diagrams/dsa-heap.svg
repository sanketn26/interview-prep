<text x="400" y="190" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Index 0 is the minimum.</text>
<text x="400" y="216" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">parent(i) = (i − 1) / 2</text>
<text x="400" y="240" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">children are 2i+1 and 2i+2</text>
<text x="400" y="264" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">9 and 12 are not ordered.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Min-heap: parent ≤ children. The array is that tree, level by level.</text>
