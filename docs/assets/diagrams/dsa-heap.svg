<text x="40" y="227" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">12</text>
<circle cx="120" cy="222" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="120" y="227" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">9</text>
<circle cx="180" cy="222" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="180" y="227" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">15</text>
