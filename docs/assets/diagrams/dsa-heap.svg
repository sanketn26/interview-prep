<text x="571" y="152" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">2</text>
<rect x="622" y="90" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="645" y="116" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">12</text>
