<text x="423" y="116" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="423" y="152" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">0</text>
<rect x="474" y="90" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
