<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img">
<title>Sort by end time. Take A [1, 4], skip what overlaps it, then take D [5, 7].</title>
<rect width="960" height="230" rx="16" fill="#f8fafc"/>
<rect x="110" y="52" width="210" height="26" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="118" y="70" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">A [1, 4]  take</text>
<rect x="250" y="88" width="140" height="26" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
<text x="258" y="106" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">B [3, 5]  skip</text>
<rect x="40" y="124" width="420" height="26" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
<text x="48" y="142" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">C [0, 6]  skip — ends later than A</text>
<rect x="390" y="160" width="140" height="26" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="398" y="178" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">D [5, 7] take</text>
<text x="40" y="210" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">A finishes first, so it leaves the most room. D starts at 5, after A has ended.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Sort by end time. Take A [1, 4], skip what overlaps it, then take D [5, 7].</text>
</svg>
