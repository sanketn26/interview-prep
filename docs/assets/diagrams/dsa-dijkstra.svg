<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img">
<title>The direct edge costs 4. The path A → C → B costs 3.</title>
<rect width="960" height="250" rx="16" fill="#f8fafc"/>
<circle cx="90" cy="90" r="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="90" y="95" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text>
<circle cx="360" cy="70" r="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="360" y="75" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">B</text>
<circle cx="220" cy="180" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="220" y="185" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">C</text>
<line x1="108" y1="86" x2="342" y2="74" stroke="#64748b" stroke-width="2"/>
<line x1="104" y1="104" x2="206" y2="166" stroke="#64748b" stroke-width="2"/>
<line x1="238" y1="170" x2="346" y2="86" stroke="#64748b" stroke-width="2"/>
<text x="220" y="62" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">4</text>
<text x="130" y="150" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">2</text>
<text x="300" y="140" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">1</text>
<text x="460" y="84" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">Settle A. dist[A] = 0</text>
<text x="460" y="112" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="start">Relax: B = 4, C = 2</text>
<text x="460" y="140" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="start">Settle C. B via C is 2 + 1 = 3</text>
<text x="460" y="168" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">3 &lt; 4, so B becomes 3</text>
<text x="460" y="204" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Only relax from a settled node.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">The direct edge costs 4. The path A → C → B costs 3.</text>
</svg>
