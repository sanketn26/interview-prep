<text x="296" y="94" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3</text>
<rect x="340" y="58" width="64" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="372" y="78" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">0</text>
