<text x="904" y="94" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">11</text>
<text x="36" y="140" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">After cat and dog, bits 1, 2, 5, 7, 9 are set.</text>
<text x="36" y="168" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="start">owl needs bit 0. Bit 0 is 0, so owl is definitely absent.</text>
<text x="36" y="196" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="start">fox hits bits 1, 7, and 9. All are 1, and fox was never added.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">A zero bit means absent. Bits that are all 1 only mean maybe.</text>
