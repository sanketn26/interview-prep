<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img">
<title>Fenwick tree: index i stores a range ending at i. A prefix sum walks the bits.</title>
<rect width="960" height="200" rx="16" fill="#f8fafc"/>
<rect x="24" y="70" width="104" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="76" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">1</text>
<text x="76" y="116" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text>
<rect x="140" y="70" width="104" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="192" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">2</text>
<text x="192" y="116" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1–2</text>
<rect x="256" y="70" width="104" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="308" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">3</text>
<text x="308" y="116" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text>
<rect x="372" y="70" width="104" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="424" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">4</text>
<text x="424" y="116" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1–4</text>
<rect x="488" y="70" width="104" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="540" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">5</text>
<text x="540" y="116" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5</text>
<rect x="604" y="70" width="104" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="656" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">6</text>
<text x="656" y="116" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5–6</text>
<rect x="720" y="70" width="104" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="772" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">7</text>
<text x="772" y="116" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">7</text>
<rect x="836" y="70" width="104" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="888" y="96" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">8</text>
<text x="888" y="116" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1–8</text>
<text x="24" y="170" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Sum to 7 reads the cells that cover 1–4, 5–6, and 7. You never scan 1 through 7.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Fenwick tree: index i stores a range ending at i. A prefix sum walks the bits.</text>
</svg>
