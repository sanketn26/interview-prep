<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img">
<title>A hard conversation: facts, then impact, then the ask.</title>
<rect width="960" height="170" rx="16" fill="#f8fafc"/>
<rect x="30" y="56" width="280" height="80" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="46" y="90" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Facts</text>
<text x="46" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">what you observed</text>
<rect x="340" y="56" width="280" height="80" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="356" y="90" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Impact</text>
<text x="356" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">who is affected</text>
<rect x="650" y="56" width="280" height="80" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="666" y="90" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Ask</text>
<text x="666" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">the next step you want</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">A hard conversation: facts, then impact, then the ask.</text>
</svg>
