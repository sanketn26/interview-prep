<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img">
<title>Choose, explore, then undo so the next branch sees a clean board.</title>
<rect width="960" height="200" rx="16" fill="#f8fafc"/>
<rect x="24" y="64" width="292" height="90" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="40" y="100" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">1  Choose</text>
<text x="40" y="128" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">place a queen in this row</text>
<rect x="336" y="64" width="292" height="90" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="352" y="100" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">2  Explore</text>
<text x="352" y="128" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">recurse into the next row</text>
<rect x="648" y="64" width="292" height="90" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="664" y="100" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">3  Un-choose</text>
<text x="664" y="128" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">remove it, try the next column</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Choose, explore, then undo so the next branch sees a clean board.</text>
</svg>
