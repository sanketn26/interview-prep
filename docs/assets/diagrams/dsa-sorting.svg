<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img">
<title>Three sorts you are asked to place, not to reimplement in production.</title>
<rect width="960" height="180" rx="16" fill="#f8fafc"/>
<rect x="30" y="56" width="290" height="84" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="46" y="90" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Quicksort</text>
<text x="46" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">in place, O(n²) worst</text>
<rect x="340" y="56" width="290" height="84" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="356" y="90" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Mergesort</text>
<text x="356" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">stable, needs extra memory</text>
<rect x="650" y="56" width="290" height="84" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="666" y="90" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Heapsort</text>
<text x="666" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">in place, poor locality</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Three sorts you are asked to place, not to reimplement in production.</text>
</svg>
