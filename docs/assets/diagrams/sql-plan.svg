<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img">
<title>This plan never touches an index. Both sides are sequential scans.</title>
<rect width="960" height="250" rx="16" fill="#f8fafc"/>
<rect x="330" y="48" width="300" height="36" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="480" y="72" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">GroupAggregate</text>
<line x1="480" y1="84" x2="480" y2="104" stroke="#64748b" stroke-width="2"/>
<rect x="300" y="104" width="360" height="36" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="480" y="128" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="750" text-anchor="middle">Hash Join   u.id = o.user_id</text>
<line x1="390" y1="140" x2="220" y2="164" stroke="#64748b" stroke-width="2"/>
<line x1="570" y1="140" x2="740" y2="164" stroke="#64748b" stroke-width="2"/>
<rect x="80" y="164" width="280" height="56" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="220" y="186" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">Seq Scan  users</text>
<text x="220" y="206" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">filter created_at</text>
<rect x="600" y="164" width="280" height="56" rx="8" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<text x="740" y="186" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">Seq Scan  orders</text>
<text x="740" y="206" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">no filter</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">This plan never touches an index. Both sides are sequential scans.</text>
