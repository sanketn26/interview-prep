<line x1="88" y1="146" x2="140" y2="190" stroke="#64748b" stroke-width="2"/>
<circle cx="160" cy="70" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="160" y="75" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">h</text>
<circle cx="160" cy="190" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="160" y="195" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">s</text>
<line x1="178" y1="70" x2="240" y2="70" stroke="#64748b" stroke-width="2"/>
<line x1="178" y1="190" x2="240" y2="190" stroke="#64748b" stroke-width="2"/>
<circle cx="260" cy="70" r="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="260" y="75" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">e</text>
<circle cx="260" cy="190" r="18" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="260" y="195" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">h</text>
<line x1="278" y1="190" x2="340" y2="190" stroke="#64748b" stroke-width="2"/>
<circle cx="360" cy="190" r="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="360" y="195" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">e</text>
<path d="M360 172 C400 120 300 40 278 62" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M278 54 L278 70 L292 62" fill="#d97706"/>
<text x="460" y="80" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Patterns: he and she</text>
<text x="460" y="112" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">Green nodes end a word.</text>
<text x="460" y="144" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="start">Dashed: she.e → he.e</text>
<text x="460" y="172" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">The suffix he is the other pattern.</text>
<text x="460" y="204" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">One pass over she reports both.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">she ends on its own e. That e fails over to the e that ends he.</text>
