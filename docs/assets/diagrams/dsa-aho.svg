<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img">
<title>she ends on its own e. That e fails over to the e that ends he.</title>
<rect width="960" height="250" rx="16" fill="#f8fafc"/>
<circle cx="70" cy="130" r="18" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="70" y="135" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">•</text>
