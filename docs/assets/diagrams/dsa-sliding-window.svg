<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img">
<title>Window of length 3. Drop the cell that leaves, add the cell that enters.</title>
<rect width="960" height="250" rx="16" fill="#f8fafc"/>
<rect x="40" y="52" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="63" y="78" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3</text>
<rect x="96" y="52" width="46" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="119" y="78" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text>
<rect x="152" y="52" width="46" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="175" y="78" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
