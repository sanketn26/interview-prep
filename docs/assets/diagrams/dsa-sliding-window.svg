<text x="287" y="78" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">8</text>
<rect x="320" y="52" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="343" y="78" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="430" y="78" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">1 + 2 + 5  =  8</text>
<rect x="40" y="130" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="63" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3</text>
<rect x="96" y="130" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="119" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text>
<rect x="152" y="130" width="46" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="175" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
<rect x="208" y="130" width="46" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="231" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">5</text>
<rect x="264" y="130" width="46" height="40" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="287" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">8</text>
<rect x="320" y="130" width="46" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="343" y="156" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="430" y="156" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">2 + 5 + 8  =  15</text>
<text x="430" y="186" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">Dropped 1. Added 8.</text>
<text x="430" y="208" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">The 2 and the 5 stayed.</text>
<text x="40" y="242" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Do not rescan cells that stayed inside the window.</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">Window of length 3. Drop the cell that leaves, add the cell that enters.</text>
