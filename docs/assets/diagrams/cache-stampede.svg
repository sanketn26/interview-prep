<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img">
<title>One expired hot key. A thousand clients miss together.</title>
<rect width="960" height="230" rx="16" fill="#f8fafc"/>
<rect x="30" y="60" width="200" height="130" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="46" y="88" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="750" text-anchor="start">Before</text>
<text x="46" y="116" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1,000 clients</text>
<text x="46" y="138" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">→ cache hit</text>
<text x="46" y="160" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">DB sees ~10 rps</text>
<rect x="250" y="60" width="280" height="130" rx="12" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<text x="266" y="88" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="750" text-anchor="start">Key expires</text>
<text x="266" y="116" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1,000 misses</text>
<text x="266" y="138" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">→ 1,000 identical queries</text>
<text x="266" y="160" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">DB falls over</text>
<rect x="550" y="60" width="380" height="130" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
<text x="566" y="88" fill="#4f46e5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="750" text-anchor="start">Three different fixes</text>
<text x="566" y="114" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Lock: one caller rebuilds</text>
<text x="566" y="136" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Jitter: keys expire apart</text>
<text x="566" y="158" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Stale: serve the old value, refresh once</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">One expired hot key. A thousand clients miss together.</text>
</svg>
