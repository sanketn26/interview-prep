<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img">
<title>A 10 ms request. Half of it may never enter your handler.</title>
<rect width="960" height="230" rx="16" fill="#f8fafc"/>
<rect x="40" y="52" width="420" height="150" rx="12" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="56" y="80" fill="#0284c7" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Network</text>
<text x="56" y="110" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">DNS lookup</text>
<text x="56" y="134" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">TCP handshake</text>
<text x="56" y="158" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">TLS negotiate</text>
<rect x="500" y="52" width="420" height="150" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
<text x="516" y="80" fill="#0d9488" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="750" text-anchor="start">Your code</text>
<text x="516" y="110" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Acquire a thread — blocked?</text>
<text x="516" y="134" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Parse, allocate, call the database</text>
<text x="516" y="158" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">Lock on the DB, then a sync log</text>
<text x="22" y="28" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="750" text-anchor="start">A 10 ms request. Half of it may never enter your handler.</text>
</svg>
